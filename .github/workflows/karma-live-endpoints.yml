name: KARMA live workbench HTTP checks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-live-apps.mjs'
      - '.github/workflows/karma-live-endpoints.yml'
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-websites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: HTTP 200, app identity and core controls
        run: node scripts/check-live-apps.mjs
