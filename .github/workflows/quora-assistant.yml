name: Quora Assistant CI

on:
  push:
    branches: [main]
    paths:
      - "quora-assistant/**"
      - ".github/workflows/quora-assistant.yml"
  pull_request:
    paths:
      - "quora-assistant/**"
      - ".github/workflows/quora-assistant.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quora-assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Summarize dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:x.title)}))"
      - name: Enforce clean dependency audit
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
